<div class="lb-content">

<div id="vz-service"></div>

<details class="lb-collapsible" open>
	<summary style="font-size:1.15em; font-weight:700;"><TMPL_VAR VZLOGGER.SET_SECTION_MAIN></summary>
	<div class="lb-collapsible-content">
		<form id="settings-form" onsubmit="return false;">

			<div class="lb-form-row">
				<label class="lb-form-label" for="set-topic"><TMPL_VAR VZLOGGER.SET_TOPIC> <a class="sm-help" href="https://wiki.volkszaehler.org/software/controller/vzlogger/vzlogger_conf_parameter#mqtt" target="_blank" rel="noopener" title="Volkszähler-Wiki">?</a></label>
				<div class="lb-form-field"><input class="lb-input" type="text" id="set-topic"></div>
				<div class="lb-form-help"><TMPL_VAR VZLOGGER.SET_TOPIC_HELP></div>
			</div>

			<div class="lb-form-row">
				<label class="lb-form-label" for="set-localport"><TMPL_VAR VZLOGGER.SET_LOCALPORT> <a class="sm-help" href="https://wiki.volkszaehler.org/software/controller/vzlogger/vzlogger_conf_parameter#local" target="_blank" rel="noopener" title="Volkszähler-Wiki">?</a></label>
				<div class="lb-form-field"><input class="lb-input" type="number" id="set-localport" min="1" max="65535"></div>
				<div class="lb-form-help"><TMPL_VAR VZLOGGER.SET_LOCALPORT_HELP></div>
			</div>

			<div class="lb-form-row">
				<label class="lb-form-label" for="set-retry"><TMPL_VAR VZLOGGER.SET_RETRY> <a class="sm-help" href="https://wiki.volkszaehler.org/software/controller/vzlogger/vzlogger_conf_parameter#root" target="_blank" rel="noopener" title="Volkszähler-Wiki">?</a></label>
				<div class="lb-form-field"><input class="lb-input" type="number" id="set-retry" min="1"></div>
				<div class="lb-form-help"><TMPL_VAR VZLOGGER.SET_RETRY_HELP></div>
			</div>

			<div class="lb-actions" style="margin-top:1em;">
				<button type="button" class="lb-btn lb-btn-primary" onclick="setSave(); return false;"><TMPL_VAR COMMON.SAVE></button>
			</div>
			<div id="set-savinghint" style="display:none; text-align:center; margin-top:0.5em;"></div>

		</form>
	</div>
</details>

<details class="lb-collapsible">
	<summary style="font-size:1.15em; font-weight:700;"><TMPL_VAR VZLOGGER.SET_SECTION_IO></summary>
	<div class="lb-collapsible-content">
		<div class="lb-form-help" style="margin-bottom:1em;"><TMPL_VAR VZLOGGER.IO_HELP></div>
		<div class="lb-actions">
			<button type="button" class="lb-btn lb-btn-primary" onclick="cfgExport(); return false;"><TMPL_VAR VZLOGGER.IO_EXPORT_BTN></button>
			<button type="button" class="lb-btn" onclick="cfgImportPick(); return false;"><TMPL_VAR VZLOGGER.IO_IMPORT_BTN></button>
			<input type="file" id="cfg-import-file" accept=".zip,application/zip" style="display:none;" onchange="cfgImportDo(this);">
		</div>
		<div id="cfg-io-status" style="display:none; text-align:center; margin-top:0.8em;"></div>
	</div>
</details>

</div>
