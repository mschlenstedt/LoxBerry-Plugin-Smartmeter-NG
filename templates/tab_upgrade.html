<div class="lb-content">

<div id="vz-service"></div>

<details class="lb-collapsible" open>
	<summary style="font-size:1.15em; font-weight:700;"><TMPL_VAR VZLOGGER.UPG_HEADING></summary>
	<div class="lb-collapsible-content">
		<p style="color:var(--lb-text-muted); font-size:0.9rem; line-height:1.6; margin:0 0 16px;"><TMPL_VAR VZLOGGER.UPG_HINT></p>

		<div class="lb-form-row">
			<label class="lb-form-label"><TMPL_VAR VZLOGGER.UPG_LABEL_CURRENT></label>
			<div class="lb-form-field"><span id="upg-current" style="font-family:var(--lb-font-mono)">…</span></div>
		</div>

		<div class="lb-form-row">
			<label class="lb-form-label"><TMPL_VAR VZLOGGER.UPG_LABEL_AVAILABLE></label>
			<div class="lb-form-field"><span id="upg-available" style="font-family:var(--lb-font-mono)">…</span></div>
		</div>

		<div id="upg-version-hint" style="display:none; text-align:center; margin-top:0.5em;"></div>

		<div class="lb-actions" style="margin-top:1em;">
			<button type="button" id="upg-btn" class="lb-btn lb-btn-primary" onclick="upgradeVzlogger(); return false;" disabled><TMPL_VAR VZLOGGER.UPG_BUTTON></button>
		</div>

		<div id="upg-status" style="display:none; text-align:center; margin-top:0.5em;"></div>

		<div class="lb-form-help" style="margin-top:1.2em;"><TMPL_VAR VZLOGGER.UPG_HINT_RESTART></div>
	</div>
</details>

</div>
