UPG_HINT="Dieses Plugin nutzt im Hintergrund <a href='https://wiki.volkszaehler.org/' target='_blank' rel='noopener'>vzLogger</a> – die Open-Source-Software, die die Zählerdaten über den Lesekopf ausliest und per MQTT bereitstellt. vzLogger wird als eigenes Paket aus dem offiziellen <a href='https://wiki.volkszaehler.org/' target='_blank' rel='noopener'>Volkszähler-Repository</a> installiert und kann hier, unabhängig vom Plugin, auf die neueste verfügbare Version aktualisiert werden."
