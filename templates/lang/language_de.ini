HINT_VZLOGGER="Wie ausführlich vzLogger protokolliert, richtet sich nach dem Loglevel des Plugins (einstellbar in der Plugin-Verwaltung). Beim voreingestellten Loglevel 3 schreibt vzLogger nur Fehler; Meldungen wie „meter connection established“ oder der Hinweis, dass ein Zähler keine Uhrzeit mitsendet, sind Info-Meldungen und erscheinen ab Loglevel 6. Nach dem Ändern des Loglevels vzLogger neu starten."
