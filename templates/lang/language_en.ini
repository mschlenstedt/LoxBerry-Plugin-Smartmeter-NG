UPG_HEADING="vzLogger update"
UPG_HINT="This plugin uses <a href='https://wiki.volkszaehler.org/' target='_blank' rel='noopener'>vzLogger</a> under the hood – the open-source software that reads the meter data from the reading head and publishes it via MQTT. vzLogger is installed as a separate package from the official <a href='https://wiki.volkszaehler.org/' target='_blank' rel='noopener'>Volkszähler repository</a> and can be updated here to the latest available version, independently of the plugin."
